<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title id="t">Cross-section of the Quartz Mesa pit, current design and after the pushback</title>
  <desc id="d">Schematic side view, not to scale. The current pit has a flat floor, sloping walls and a rim. The pushback extends the walls outward and the floor downward by the same wall slope. A cylinder of ore lies directly under the current floor and is uncovered by the pushback.</desc>
  <rect width="640" height="330" fill="#ffffff"/>
  <!-- ground line -->
  <line x1="10" y1="40" x2="630" y2="40" stroke="#555" stroke-width="2"/>
  <text x="14" y="32" fill="#333">Rim plane</text>
  <!-- pushback pit (outer) -->
  <polygon points="40,40 600,40 410,250 230,250" fill="#e9dcc3" stroke="#7a5c2e" stroke-width="2"/>
  <!-- current pit (inner) -->
  <polygon points="85,40 555,40 395,210 245,210" fill="#ffffff" stroke="#2b4a6f" stroke-width="2"/>
  <!-- ore pipe -->
  <rect x="270" y="210" width="100" height="40" fill="#e0b32c" stroke="#8a6a00" stroke-width="1.5"/>
  <text x="320" y="235" text-anchor="middle" fill="#3a2d00">ore pipe</text>
  <!-- labels -->
  <text x="320" y="130" text-anchor="middle" fill="#2b4a6f">current-design pit</text>
  <text x="320" y="150" text-anchor="middle" fill="#2b4a6f" font-size="11">(planned reserve inside)</text>
  <text x="95" y="150" fill="#7a5c2e">pushback shell</text>
  <text x="95" y="166" fill="#7a5c2e" font-size="11">(waste + top of ore pipe)</text>
  <line x1="320" y1="40" x2="320" y2="205" stroke="#2b4a6f" stroke-dasharray="4,3"/>
  <text x="326" y="78" fill="#2b4a6f" font-size="11">depth to current floor</text>
  <text x="320" y="272" text-anchor="middle" fill="#8a6a00" font-size="11">floor after the pushback is the lower edge of the ore pipe</text>
  <text x="320" y="300" text-anchor="middle" fill="#444" font-size="11">Schematic only, not to scale. Dimensions are in Appendix B.</text>
</svg>
