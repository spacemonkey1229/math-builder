<svg viewBox="0 0 520 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: each lane's hand contact, then the pad registering after a lag" width="900" height="346"><rect x="0" y="0" width="520" height="200" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="10" y="18" font-size="12" fill="#1a3a5c">Illustration only: made-up, not to scale, not this race's values</text>
  <line x1="20" y1="170" x2="500" y2="170" stroke="#444" stroke-width="1.5"/>
  <text x="440" y="190" font-size="11" fill="#444">time &#8594;</text>
  <text x="20" y="62" font-size="12" fill="#7a4a00">Lane of swimmer C</text>
  <circle cx="200" cy="75" r="6" fill="#d9822b"/><text x="150" y="98" font-size="11">hand touches</text>
  <circle cx="330" cy="75" r="6" fill="none" stroke="#d9822b" stroke-width="2.5"/><text x="305" y="98" font-size="11">pad registers</text>
  <line x1="206" y1="75" x2="324" y2="75" stroke="#d9822b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="240" y="68" font-size="11">lag of C</text>
  <text x="20" y="122" font-size="12" fill="#1a3a5c">Lane of swimmer P</text>
  <circle cx="240" cy="135" r="6" fill="#2b6cb0"/><text x="190" y="158" font-size="11">hand touches</text>
  <circle cx="300" cy="135" r="6" fill="none" stroke="#2b6cb0" stroke-width="2.5"/><text x="275" y="158" font-size="11">pad registers</text>
  <line x1="246" y1="135" x2="294" y2="135" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="4 3"/><text x="258" y="128" font-size="11">lag of P</text>
</svg>