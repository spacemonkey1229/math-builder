<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Box plot anatomy with made-up numbers: whiskers, box from first to third quartile, median line, and one outlier point">
  <rect width="640" height="230" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a2a3a">
    <!-- axis: value v maps to x = 40 + v*22 -->
    <line x1="40" y1="150" x2="600" y2="150" stroke="#1a2a3a" stroke-width="1.5"/>
    <g stroke="#1a2a3a" stroke-width="1.2">
      <line x1="40" y1="150" x2="40" y2="156"/><line x1="150" y1="150" x2="150" y2="156"/>
      <line x1="260" y1="150" x2="260" y2="156"/><line x1="370" y1="150" x2="370" y2="156"/>
      <line x1="480" y1="150" x2="480" y2="156"/><line x1="590" y1="150" x2="590" y2="156"/>
    </g>
    <g text-anchor="middle">
      <text x="40" y="172">0</text><text x="150" y="172">5</text><text x="260" y="172">10</text>
      <text x="370" y="172">15</text><text x="480" y="172">20</text><text x="590" y="172">25</text>
      <text x="320" y="196" font-weight="700">values (invented numbers, structure only)</text>
    </g>
    <!-- whiskers -->
    <line x1="84" y1="100" x2="128" y2="100" stroke="#1a2a3a" stroke-width="2"/>
    <line x1="84" y1="88" x2="84" y2="112" stroke="#1a2a3a" stroke-width="2"/>
    <line x1="282" y1="100" x2="370" y2="100" stroke="#1a2a3a" stroke-width="2"/>
    <line x1="370" y1="88" x2="370" y2="112" stroke="#1a2a3a" stroke-width="2"/>
    <!-- box Q1=4 (x=128) to Q3=11 (x=282), median 7 (x=194) -->
    <rect x="128" y="76" width="154" height="48" fill="#d9e8f5" stroke="#1a2a3a" stroke-width="2"/>
    <line x1="194" y1="76" x2="194" y2="124" stroke="#b3261e" stroke-width="3"/>
    <!-- outlier at 24 (x=568) -->
    <circle cx="568" cy="100" r="5" fill="#1a2a3a"/>
    <!-- labels -->
    <g text-anchor="middle">
      <text x="84" y="68">smallest value</text><text x="84" y="82">inside the fences</text>
      <text x="128" y="132" dy="40" opacity="0"> </text>
      <text x="128" y="44">first quartile (Q1)</text>
      <text x="194" y="30" fill="#b3261e" font-weight="700">median</text>
      <text x="282" y="44">third quartile (Q3)</text>
      <text x="370" y="68">largest value</text><text x="370" y="82">inside the fences</text>
      <text x="568" y="78">outlier</text>
    </g>
    <text x="205" y="140" text-anchor="middle" font-size="12">the box is the IQR (Q3 − Q1)</text>
  </g>
</svg>
