<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 150" role="img" aria-label="Timeline: sign and invest, wait 11 years, then 25 yearly payments" font-family="sans-serif" font-size="13">
<rect width="720" height="150" fill="none"/>
<rect x="10" y="50" width="130" height="38" rx="6" fill="#e8f0fa" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="75.0" y="74" text-anchor="middle" fill="#1f3a5f">Sign: cash invested</text>
<rect x="140" y="50" width="300" height="38" rx="6" fill="#fff4d6" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="290.0" y="74" text-anchor="middle" fill="#1f3a5f">Wait: 11 years, pool earns the market's yearly returns</text>
<rect x="440" y="50" width="270" height="38" rx="6" fill="#e3f3e6" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="575.0" y="74" text-anchor="middle" fill="#1f3a5f">25 yearly payments, first one due</text>
<text x="10" y="28" font-weight="700" fill="#1f3a5f">The deferral on one clock (every date is January 1)</text>
<text x="10" y="112" fill="#444">Snapshot test on the first payment date: pool compared with the debt then owed.</text>
<text x="10" y="132" fill="#666" font-size="11">Illustrative structure only; no results shown. Case timing from Appendix A.</text>
</svg>