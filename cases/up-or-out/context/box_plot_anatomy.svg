<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Anatomy of a box-and-whisker plot with made-up example numbers: minimum, first quartile, median, third quartile, maximum and an outlier">
  <title>Anatomy of a box-and-whisker plot (made-up numbers, not case data)</title>
  <line x1="40" y1="110" x2="600" y2="110" stroke="#555" stroke-width="1"/>
  <line x1="80" y1="110" x2="180" y2="110" stroke="#222" stroke-width="2"/>
  <line x1="80" y1="95" x2="80" y2="125" stroke="#222" stroke-width="2"/>
  <rect x="180" y="80" width="200" height="60" fill="#cfe3f5" stroke="#222" stroke-width="2"/>
  <line x1="270" y1="80" x2="270" y2="140" stroke="#c0392b" stroke-width="3"/>
  <line x1="380" y1="110" x2="480" y2="110" stroke="#222" stroke-width="2"/>
  <line x1="480" y1="95" x2="480" y2="125" stroke="#222" stroke-width="2"/>
  <circle cx="560" cy="110" r="5" fill="none" stroke="#222" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">
    <text x="80" y="160">minimum</text><text x="180" y="160">Q1</text><text x="270" y="160">median</text>
    <text x="380" y="160">Q3</text><text x="480" y="160">largest value inside the fence</text><text x="560" y="140">outlier</text>
    <text x="280" y="65">box = middle half of the values (Q1 to Q3); its width is the IQR</text>
    <text x="320" y="200">Illustration with made-up numbers. Whiskers reach the most extreme values inside the 1.5 x IQR fences.</text>
  </g>
</svg>
